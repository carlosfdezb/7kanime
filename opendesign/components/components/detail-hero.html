<!-- 
  COMPONENT: Detail Hero
  Used in: detalle.html, manga-detalle.html
  
  Required CSS classes from design system:
  - .detail-hero, .detail-backdrop, .detail-hero-content
  - .detail-poster
  - .detail-info, .detail-meta-top
  - .badge, .badge-status, .badge-type, .score-badge
  - .detail-title, .detail-aka, .detail-genres
  - .genre-chip
  - .detail-actions, .btn-primary, .btn-secondary
  
  Features:
  - Two-column layout: poster (280px) + info (1fr)
  - Full-width backdrop with deep gradient overlay
  - Poster with shadow and rounded corners (20px)
  - Badges: status, type, year, episodes/chapters, score
  - Genre chips: horizontal wrap list
  - Action buttons: primary (play/read), secondary (favorite, share)
  - Responsive: stacks to single column on mobile, centered
  
  Variants:
  - Anime: Shows episodes, studio, duration
  - Manga: Shows chapters, author, magazine
-->

<link rel="stylesheet" href="../styles.css" />

<section class="detail-hero">
  <div class="detail-backdrop">
    <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1920&q=80" alt="">
  </div>

  <div class="container detail-hero-content">
    <div class="detail-poster">
      <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&q=80" alt="Demon Slayer">
    </div>

    <div class="detail-info">
      <div class="detail-meta-top">
        <span class="badge badge-status">En Emisión</span>
        <span class="badge badge-type">TV Anime</span>
        <span class="badge badge-type">2024</span>
        <span class="badge badge-type">24 eps</span>
        <span class="score-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
          </svg>
          8.7
        </span>
      </div>

      <h1 class="detail-title">Demon Slayer: Kimetsu no Yaiba</h1>
      <p class="detail-aka">鬼滅の刃</p>

      <div class="detail-genres">
        <span class="genre-chip">Acción</span>
        <span class="genre-chip">Fantasía</span>
        <span class="genre-chip">Shounen</span>
        <span class="genre-chip">Sobrenatural</span>
        <span class="genre-chip">Artes Marciales</span>
        <span class="genre-chip">Drama</span>
      </div>

      <div class="detail-actions">
        <a href="/episode/demon-slayer/1" class="btn-primary" data-tv-focus="true" data-tv-focus-id="play-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
          Ver ahora
        </a>
        <button class="btn-secondary" id="favoriteBtn" data-tv-focus="true" data-tv-focus-id="favorite-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          Agregar a favoritos
        </button>
        <button class="btn-secondary" data-tv-focus="true" data-tv-focus-id="share-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          Compartir
        </button>
      </div>
    </div>
  </div>
</section>

<script>
  // Favorite toggle
  const favoriteBtn = document.getElementById('favoriteBtn');
  let isFavorite = false;
  
  favoriteBtn.addEventListener('click', () => {
    isFavorite = !isFavorite;
    favoriteBtn.classList.toggle('active', isFavorite);
    favoriteBtn.innerHTML = isFavorite
      ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg> En favoritos`
      : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg> Agregar a favoritos`;
  });
</script>

<!-- 
  COMPONENT: Episode Row / Chapter Row
  Used in: detalle.html (episodes list), manga-detalle.html (chapters list),
           visualizador.html (episodes list), manga-lector.html (chapters list)
  
  Required CSS classes from design system:
  - .episodes-section / .chapters-section
  - .episodes-header / .chapters-header, .episodes-count / .chapters-count
  - .episodes-list / .chapters-list
  - .episode-row / .chapter-row, .episode-row.watched / .chapter-row.read
  - .episode-play / .chapter-read-icon
  - .episode-num / .chapter-num
  - .episode-info / .chapter-info
  - .episode-title / .chapter-title
  - .episode-meta / .chapter-meta
  - .episode-duration / .chapter-date
  - .episode-status / .chapter-status
  
  Features:
  - Horizontal row: play icon + number + title/meta + duration/date + status
  - Hover: background lighten, border glow, translateX(4px)
  - Watched/Read state: green tint, success border
  - Current state: accent background (in list views)
  - Play icon transforms to gradient on hover
  - TV navigation support
  
  Variants:
  - Episode: Has duration, watched status dot
  - Chapter: Has date, read status dot, order toggle
-->

<link rel="stylesheet" href="../styles.css" />

<!-- EPISODES LIST -->
<section class="episodes-section">
  <div class="episodes-header">
    <h2 class="section-title">Episodios</h2>
    <span class="episodes-count">24 episodios</span>
  </div>

  <div class="episodes-list">
    
    <!-- Watched Episode -->
    <a href="/episode/demon-slayer/1" class="episode-row watched" data-tv-focus="true" data-tv-focus-id="episode-1">
      <div class="episode-play">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </div>
      <div class="episode-num">01</div>
      <div class="episode-info">
        <div class="episode-title">Crueldad</div>
        <div class="episode-meta">
          <span>Episodio 1</span>
          <span style="color: var(--status-success);">Visto</span>
        </div>
      </div>
      <div class="episode-duration">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12,6 12,12 16,14"/>
        </svg>
        24 min
      </div>
      <div class="episode-status"></div>
    </a>

    <!-- Unwatched Episode -->
    <a href="/episode/demon-slayer/6" class="episode-row" data-tv-focus="true" data-tv-focus-id="episode-6">
      <div class="episode-play">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </div>
      <div class="episode-num">06</div>
      <div class="episode-info">
        <div class="episode-title">Demonio con forma de demonio</div>
        <div class="episode-meta">
          <span>Episodio 6</span>
        </div>
      </div>
      <div class="episode-duration">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12,6 12,12 16,14"/>
        </svg>
        24 min
      </div>
    </a>

  </div>
</section>

<!-- CHAPTERS LIST -->
<section class="chapters-section">
  <div class="chapters-header">
    <h2 class="section-title">Capítulos</h2>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span class="chapters-count">245 capítulos</span>
      <button class="order-toggle" id="orderToggle">
        <span>↑ Primeros</span>
      </button>
    </div>
  </div>

  <div class="chapters-list">
    
    <!-- Read Chapter -->
    <a href="/manga/jujutsu-kaisen/chapter/1" class="chapter-row read" data-tv-focus="true" data-tv-focus-id="chapter-1">
      <div class="chapter-read-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="chapter-num">001</div>
      <div class="chapter-info">
        <div class="chapter-title">Ryomen Sukuna</div>
        <div class="chapter-meta">
          <span>Capítulo 1</span>
          <span style="color: var(--status-success);">Leído</span>
        </div>
      </div>
      <div class="chapter-date">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        5 Mar 2018
      </div>
      <div class="chapter-status"></div>
    </a>

    <!-- Unread Chapter -->
    <a href="/manga/jujutsu-kaisen/chapter/6" class="chapter-row" data-tv-focus="true" data-tv-focus-id="chapter-6">
      <div class="chapter-read-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="chapter-num">006</div>
      <div class="chapter-info">
        <div class="chapter-title">Alimentos y mujeres</div>
        <div class="chapter-meta">
          <span>Capítulo 6</span>
        </div>
      </div>
      <div class="chapter-date">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        9 Mar 2018
      </div>
    </a>

  </div>
</section>

<!-- 
  COMPONENT: Empty State
  Used in: index.html, manga.html (when no results)
  
  Required CSS classes from design system:
  - .empty-state
  - .empty-state-icon
  
  Features:
  - Centered flex layout
  - Icon + title + description + action button
  - Used when filters return no results or search is empty
  - Padding: 80px vertical
  
  Variants:
  - No results: Search icon + "No se encontraron resultados"
  - Empty search: Search icon + "Escribe algo para buscar"
  - Error: Alert icon + error message
-->

<link rel="stylesheet" href="../styles.css" />

<!-- No Results -->
<div class="empty-state">
  <div class="empty-state-icon">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      <line x1="11" y1="8" x2="11" y2="11"/>
      <line x1="11" y1="11" x2="14" y2="14"/>
    </svg>
  </div>
  <h3>No se encontraron resultados</h3>
  <p>Intenta ajustar los filtros o busca con otros términos</p>
</div>

<!-- Empty Search -->
<div class="empty-state">
  <div class="empty-state-icon">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </div>
  <h3>Buscar anime</h3>
  <p>Escribe el nombre de un anime para comenzar</p>
</div>

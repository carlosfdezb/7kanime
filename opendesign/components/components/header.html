<!-- 
  COMPONENT: Header / Navigation
  Used in: index.html, manga.html, detalle.html, manga-detalle.html, visualizador.html, manga-lector.html
  
  Required CSS classes from design system:
  - .header, .header.scrolled, .header-inner
  - .logo, .logo-accent, .logo-text
  - .nav, .nav-link, .nav-link.active
  - .header-actions, .search-toggle, .search-form, .search-input, .search-icon
  - .avatar-btn
  
  Features:
  - Fixed position with glassmorphism on scroll
  - Responsive: hides nav on mobile, shows search toggle
  - TV navigation support: data-tv-focus="true"
  
  Variants:
  - Default: Full header with nav + search + avatar (index.html, manga.html)
  - Minimal: Logo + back button (visualizador.html, manga-lector.html)
  - Detail: Logo only (detalle.html, manga-detalle.html)
-->

<link rel="stylesheet" href="../styles.css" />

<!-- DEFAULT HEADER -->
<header class="header" id="header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="7Kanime - Inicio" data-tv-focus="true" data-tv-focus-id="header-logo">
      <span class="logo-accent">7K</span><span class="logo-text">anime</span>
    </a>

    <nav class="nav" aria-label="Navegación principal">
      <a href="/" class="nav-link active">Anime</a>
      <a href="/manga" class="nav-link">Manga</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="search-toggle" id="searchToggle" aria-label="Buscar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
      </button>

      <form class="search-form" id="searchForm" onsubmit="return false;">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" class="search-input" placeholder="Buscar anime..." aria-label="Buscar anime" id="searchInput">
      </form>

      <button type="button" class="avatar-btn" id="userMenuBtn" aria-label="Menú de usuario" data-tv-focus="true" data-tv-focus-id="user-menu-btn">
        U
      </button>
    </div>
  </div>
</header>

<!-- MINIMAL HEADER (for player/reader pages) -->
<header class="header" id="header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="7Kanime - Inicio">
      <span class="logo-accent">7K</span><span class="logo-text">anime</span>
    </a>
    <a href="/anime/demon-slayer" class="back-btn" data-tv-focus="true" data-tv-focus-id="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12,19 5,12 12,5"/>
      </svg>
      <span>Volver al anime</span>
    </a>
  </div>
</header>

<!-- DETAIL HEADER (logo only) -->
<header class="header" id="header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="7Kanime - Inicio">
      <span class="logo-accent">7K</span><span class="logo-text">anime</span>
    </a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="/" class="nav-link active">Anime</a>
      <a href="/manga" class="nav-link">Manga</a>
    </nav>
  </div>
</header>

<script>
  // Header scroll effect
  const header = document.getElementById('header');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });

  // Search toggle (mobile)
  const searchToggle = document.getElementById('searchToggle');
  const searchForm = document.getElementById('searchForm');
  if (searchToggle && searchForm) {
    searchToggle.addEventListener('click', () => {
      searchForm.classList.toggle('open');
      if (searchForm.classList.contains('open')) {
        document.getElementById('searchInput').focus();
      }
    });
  }
</script>
